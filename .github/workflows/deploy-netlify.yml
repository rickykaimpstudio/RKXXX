name: Publier After Dark sur Netlify (site existant)
on:
  push:
    branches: [main]
    paths:
      - 'app.mjs'
      - 'index.html'
      - 'styles.css'
      - 'adult-provider.mjs'
      - '_headers'
      - 'catalog.json'
      - 'netlify.toml'
      - 'netlify/functions/**'
      - 'tools/**'
      - '.github/workflows/deploy-netlify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: afterdark-netlify-production
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NETLIFY_SITE_ID: '85d4abaa-9e41-4e67-96f2-0a3019099226'
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier la permission Netlify
        shell: bash
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            echo "::error::NETLIFY_AUTH_TOKEN absent du dépôt RKXXX. Créer un secret GitHub Actions dans Settings > Secrets and variables > Actions. Cible Netlify déjà configurée."
            exit 1
          fi
      - name: Vérifier et préparer le site
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node tools/prepare-public.mjs
          test -s dist/index.html
          test -s dist/catalog.json
      - name: Publier sur le site Netlify existant (aucun nouveau site)
        shell: bash
        run: |
          npx --yes netlify-cli deploy --prod --build --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "After Dark RKXXX main: $GITHUB_SHA"
