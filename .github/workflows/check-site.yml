name: Vérifier le site After Dark
on:
  push:
    paths:
      - "*.mjs"
      - "*.html"
      - "*.css"
      - "netlify.toml"
      - ".github/workflows/check-site.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les modules JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in *.mjs; do
            node --check "$file"
          done
          grep -q 'app.mjs' index.html
          grep -q 'styles.css' index.html
          test -s _headers
          test -s netlify.toml
