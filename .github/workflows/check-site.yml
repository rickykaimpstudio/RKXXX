name: Vérifier le site After Dark
on:
  push:
    paths:
      - "**/*.mjs"
      - "*.html"
      - "*.css"
      - "netlify.toml"
      - ".github/workflows/check-site.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider les modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.mjs' -not -path './dist/*' -print0)
          node --test tests/*.test.mjs
          node tools/prepare-public.mjs
          test -s dist/index.html
          test -s dist/app.mjs
          test ! -e dist/netlify/functions/catalog.mjs
          grep -q 'app.mjs' dist/index.html
          test -s dist/_headers
